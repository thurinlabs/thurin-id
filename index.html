<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Proof checks, the Ethereum node, and outbound links are told nothing about the page that asked. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://thurin.id/" />
    <title>Thurin.id: PGP keys on Ethereum</title>
    <meta name="description" content="Look up anyone's PGP key, or put yours on your Ethereum address. Anyone can check it, and none of it depends on us." />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thurin.id: PGP keys on Ethereum" />
    <meta property="og:description" content="Look up anyone's PGP key, or put yours on your Ethereum address. Anyone can check it, and none of it depends on us." />
    <meta property="og:url" content="https://thurin.id" />
    <meta property="og:image" content="https://thurin.id/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thurinlabs" />
    <meta name="twitter:title" content="Thurin.id: PGP keys on Ethereum" />
    <meta name="twitter:description" content="Look up anyone's PGP key, or put yours on your Ethereum address. Anyone can check it, and none of it depends on us." />
    <meta name="twitter:image" content="https://thurin.id/og-image.png" />
    <script>
      // Two modes: a saved "light", else dark.
      var theme = null;
      try { theme = localStorage.getItem('thurin-theme'); } catch (e) {}
      document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
      // Where path routes work (thurin.id, *.eth.limo via _redirects, local dev), pin
      // relative asset URLs to the site root so /eth/<addr> still loads ./assets/*.
      // Keep in sync with usesPathRouting() in src/App.jsx.
      var h = window.location.hostname;
      if (h === 'thurin.id' || /\.eth\.limo$/.test(h) || h === 'localhost' || h === '127.0.0.1') {
        var base = document.createElement('base');
        base.href = '/';
        document.head.prepend(base);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
