<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://thurin.id/" />
    <title>Thurin.id — Prove more. Reveal less.</title>
    <meta name="description" content="Prove an online identity is really yours. Look up any ENS name, Ethereum address, or PGP fingerprint and see the claims and proofs behind it, checked in your browser. No company in the middle." />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thurin.id — Prove more. Reveal less." />
    <meta property="og:description" content="Prove an online identity is really yours. Look up any ENS name, Ethereum address, or PGP fingerprint and see the claims and proofs behind it, checked in your browser. No company in the middle." />
    <meta property="og:url" content="https://thurin.id" />
    <meta property="og:image" content="https://thurin.id/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thurinlabs" />
    <meta name="twitter:title" content="Thurin.id — Prove more. Reveal less." />
    <meta name="twitter:description" content="Prove an online identity is really yours. Look up any ENS name, address, or PGP fingerprint." />
    <meta name="twitter:image" content="https://thurin.id/og-image.png" />
    <script>
      // Theme key migrated from 'thurin-scry-theme' (pre-0.5.0). Read the old key
      // once, rewrite under the new one, so returning visitors keep their theme.
      var theme = localStorage.getItem('thurin-theme');
      if (!theme) {
        var legacy = localStorage.getItem('thurin-scry-theme');
        if (legacy) {
          theme = legacy;
          localStorage.setItem('thurin-theme', legacy);
          localStorage.removeItem('thurin-scry-theme');
        }
      }
      document.documentElement.dataset.theme = theme || 'thurin';
      // Where path routes work (thurin.id, *.eth.limo via _redirects, local dev), pin
      // relative asset URLs to the site root so /eth/<addr> still loads ./assets/*.
      // Keep in sync with usesPathRouting() in src/App.jsx.
      var h = window.location.hostname;
      if (h === 'thurin.id' || /\.eth\.limo$/.test(h) || h === 'localhost' || h === '127.0.0.1') {
        var base = document.createElement('base');
        base.href = '/';
        document.head.prepend(base);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
