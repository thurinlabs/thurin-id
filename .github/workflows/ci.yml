name: CI

on:
  push:
  pull_request:

# thurin-id depends on @thurinlabs/identity-kit via `file:../identity-kit`, so CI
# checks out identity-kit as a sibling and builds it before building thurin-id.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout thurin-id
        uses: actions/checkout@v4
        with:
          path: thurin-id
      - name: Checkout identity-kit (local dependency)
        uses: actions/checkout@v4
        with:
          repository: thurinlabs/identity-kit
          path: identity-kit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build identity-kit
        working-directory: identity-kit
        run: npm ci && npm run build
      - name: Build thurin-id
        working-directory: thurin-id
        run: npm install && npm run build
